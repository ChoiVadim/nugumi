name: macOS CI

# Deliberately just build + test. Packaging the .app used to be a step here and
# it could never have passed: build-app-bundle.sh wants a pinned uv 0.11.26, a
# pnpm workspace and a Developer ID identity, none of which a runner has, and the
# release is cut locally anyway. A check nobody can make green teaches people to
# ignore the red dot, which is worse than having no check.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Show toolchain version
        run: swift --version

      # Separate from `swift test` on purpose: the tests do not depend on the
      # Gizmate executable target, so only this step notices if it stops building.
      - name: Build
        run: swift build

      - name: Test
        run: swift test
