name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build app bundle
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Run Swift tests
        run: swift test

      - name: Build distributable app bundle
        run: bash Scripts/build-app-bundle.sh

      - name: Verify app bundle artifacts
        run: |
          test -d dist/Gizmate.app
          test -f dist/Gizmate.dmg
          test -d dist/Gizmate.app/Contents/Resources/Gizmate_Gizmate.bundle
          plutil -lint dist/Gizmate.app/Contents/Info.plist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Gizmate-${{ github.sha }}.dmg
          path: dist/Gizmate.dmg
          if-no-files-found: error
          retention-days: 14
